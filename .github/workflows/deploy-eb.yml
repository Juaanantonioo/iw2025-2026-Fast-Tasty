name: CI/CD - Deploy to Elastic Beanstalk

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node (for Vaadin/Vite)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: fastfoodmanager/package-lock.json

      # Ajusta el working-directory si tu proyecto está en subcarpeta
      - name: Build (Vaadin production, skip tests)
        working-directory: fastfoodmanager
        run: mvn -Pproduction -DskipTests clean package

      - name: Prepare deploy bundle (application.jar inside zip)
        working-directory: fastfoodmanager
        run: |
          mkdir -p deploy
          JAR=$(ls -1 target/*.jar | grep -vE 'original-.*\.jar$' | head -n 1)
          echo "Using jar: $JAR"
          cp "$JAR" deploy/application.jar
          cd deploy
          zip -r app.zip application.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_session_token: ${{ secrets.AWS_SESSION_TOKEN }}
          application_name: ${{ secrets.EB_APPLICATION_NAME }}
          environment_name: ${{ secrets.EB_ENVIRONMENT_NAME }}
          version_label: github-${{ github.sha }}
          region: ${{ secrets.AWS_REGION }}
          deployment_package: fastfoodmanager/deploy/app.zip
          use_existing_version_if_available: true

      - name: Check env has AWS creds (masked)
        run: |
          test -n "${AWS_ACCESS_KEY_ID:-}" && echo "AWS_ACCESS_KEY_ID present"
          test -n "${AWS_SECRET_ACCESS_KEY:-}" && echo "AWS_SECRET_ACCESS_KEY present"
          test -n "${AWS_SESSION_TOKEN:-}" && echo "AWS_SESSION_TOKEN present"