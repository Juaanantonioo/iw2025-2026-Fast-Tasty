name: Deploy to Elastic Beanstalk

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build (jar)
        working-directory: fastfoodmanager
        run: mvn -B -DskipTests package

      - name: Prepare deployment package
        run: |
          mkdir -p deploy
          cp fastfoodmanager/target/*.jar deploy/application.jar
          cd deploy
          zip -r app.zip application.jar

      - name: Deploy to Elastic Beanstalk
        uses: einaregilsson/beanstalk-deploy@v22
        with:
          aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          application_name: FastTasty
          environment_name: FastTasty-env
          region: us-east-1
          version_label: ${{ github.sha }}
          deployment_package: deploy/app.zip