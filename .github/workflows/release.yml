name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build (jar)
        working-directory: fastfoodmanager
        run: mvn -B -DskipTests package

      - name: Create GitHub Release + upload jar
        uses: softprops/action-gh-release@v2
        with:
          files: fastfoodmanager/target/*.jar
          generate_release_notes: true